<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cristhian Mayorga · Data Engineer & AI / Full-Stack Developer</title>
    <meta
      name="description"
      content="Portafolio de Cristhian Andres Mayorga Caiser — Data Engineer, AI y Full-Stack Developer. Automatización de procesos, arquitecturas de datos escalables y ciberseguridad. GCI World 2026, Matsuo Lab – Universidad de Tokio."
    />
    <meta name="theme-color" content="#020617" />
    <!-- Aplica el tema guardado ANTES de pintar para evitar un destello de color.
         Por defecto: oscuro. Debe coincidir con src/theme/ThemeContext.jsx -->
    <script>
      try {
        if (localStorage.getItem('portfolio-theme') === 'light') {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
